name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [ main, master, ios ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          cd ios
          ./bootstrap.sh

      - name: Build
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

      - name: Test
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            test

      - name: Build Unsigned IPA
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PROVISIONING_PROFILE= \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

          APP_PATH="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/YamabikoChat.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/YamabikoChat-unsigned.ipa"

          test -d "$APP_PATH"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip -qry "$IPA_PATH" Payload

      - name: Upload Unsigned IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: YamabikoChat-unsigned-ipa
          path: ${{ runner.temp }}/YamabikoChat-unsigned.ipa
          if-no-files-found: error
