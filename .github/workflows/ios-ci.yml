name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/check-*.py"
      - "third_party/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - "scripts/check-*.py"
      - "third_party/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    # Xcode 27 is available on this image, not macos-26.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.0"
      APP_STORE_MAX_SDK_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test GenUI DOM rendering
        run: |
          npm ci --prefix ios/GenUIRuntimeTests --ignore-scripts
          npm test --prefix ios/GenUIRuntimeTests

      - name: Cache offline Python WASM assets
        uses: actions/cache@v6
        with:
          path: |
            ios/Vendor/Pyodide
            ios/Vendor/PyodideCache
          key: ios-python-wasm-${{ runner.os }}-${{ hashFiles('ios/scripts/bootstrap-python-wasm.py') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          cd ios
          ./bootstrap.sh

      - name: Verify provider contracts and Pi bundle
        run: |
          npm run check:contracts --prefix ios/PiRuntime
          (cd ios/PiRuntime && npm test)
          python3 -m unittest ios/PythonTests/test_yamabiko_runtime.py
          python3 ios/scripts/test-node-mobile-bootstrap.py
          for test_script in ios/scripts/test-*.sh; do
            "$test_script"
          done

      - name: Build and Test
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -resultBundlePath "$RUNNER_TEMP/YamabikoTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            test

      - name: Upload Test Results
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: YamabikoTests-xcresult
          path: ${{ runner.temp }}/YamabikoTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Unsigned IPA
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PROVISIONING_PROFILE= \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

          APP_PATH="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/YamabikoChat.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/YamabikoChat-unsigned.ipa"

          test -d "$APP_PATH"
          scripts/validate-app-sdk-versions.sh "$APP_PATH" "$APP_STORE_MAX_SDK_VERSION"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip -qry "$IPA_PATH" Payload

      - name: Upload Unsigned IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: YamabikoChat-unsigned-ipa
          path: ${{ runner.temp }}/YamabikoChat-unsigned.ipa
          if-no-files-found: error
