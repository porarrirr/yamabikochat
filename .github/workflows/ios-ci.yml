name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - "app/src/main/java/com/porarri/yamabikochat/data/remote/ProviderCatalog.kt"
      - "app/src/main/assets/pi-runtime/**"
      - "scripts/bootstrap-pi-runtime-android.sh"
      - "scripts/check-opencode-go-contract.py"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [ main, master, ios ]
    paths:
      - "ios/**"
      - "app/src/main/java/com/porarri/yamabikochat/data/remote/ProviderCatalog.kt"
      - "app/src/main/assets/pi-runtime/**"
      - "scripts/bootstrap-pi-runtime-android.sh"
      - "scripts/check-opencode-go-contract.py"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.5"
      APP_STORE_MAX_SDK_VERSION: "26.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache iOS Python wheels
        uses: actions/cache@v4
        with:
          path: ios/Vendor/PythonWheelhouse
          key: ios-python-wheels-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('ios/python-scientific-sources.env', 'ios/python-wheels.sha256', 'ios/scripts/build-python-scientific-wheels.sh', 'ios/scripts/run-ios-cibuildwheel.py') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          cd ios
          ./bootstrap.sh

      - name: Verify OpenCode Go API contract and Pi bundle
        run: |
          python3 scripts/check-opencode-go-contract.py
          git diff --exit-code -- ios/PiRuntime/bundle/main.js app/src/main/assets/pi-runtime/main.js
          (cd ios/PiRuntime && npm test)
          python3 -m unittest ios/PythonTests/test_yamabiko_runtime.py
          ios/scripts/test-align-python-framework-minimum-os.sh
          ios/scripts/test-validate-app-sdk-versions.sh

      - name: Build
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

      - name: Test
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            test

      - name: Build Unsigned IPA
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PROVISIONING_PROFILE= \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

          APP_PATH="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/YamabikoChat.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/YamabikoChat-unsigned.ipa"

          test -d "$APP_PATH"
          scripts/validate-app-sdk-versions.sh "$APP_PATH" "$APP_STORE_MAX_SDK_VERSION"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip -qry "$IPA_PATH" Payload

      - name: Upload Unsigned IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: YamabikoChat-unsigned-ipa
          path: ${{ runner.temp }}/YamabikoChat-unsigned.ipa
          if-no-files-found: error
