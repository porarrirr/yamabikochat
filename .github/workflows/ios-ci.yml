name: iOS CI

on:
  pull_request:
    paths:
      - "pryamabiko/ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [ main, master, ios ]
    paths:
      - "pryamabiko/ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_test:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pryamabiko/ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

      - name: Test
        run: |
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            test
