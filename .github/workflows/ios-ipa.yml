name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag override"
        required: false
        default: ""
        type: string
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ipa:
    # Xcode 27 is available on this image, not macos-26.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.0"
      APP_STORE_MAX_SDK_VERSION: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache offline Python WASM assets
        uses: actions/cache@v6
        with:
          path: |
            ios/Vendor/Pyodide
            ios/Vendor/PyodideCache
          key: ios-python-wasm-${{ runner.os }}-${{ hashFiles('ios/scripts/bootstrap-python-wasm.py') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: |
          cd ios
          ./bootstrap.sh

      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild \
            -project YamabikoChat.xcodeproj \
            -scheme YamabikoChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE_SPECIFIER= \
            PROVISIONING_PROFILE= \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            build

      - name: Package Unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/YamabikoChat.app"
          IPA_DIR="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/YamabikoChat-unsigned.ipa"

          test -d "$APP_PATH"
          ios/scripts/validate-app-sdk-versions.sh "$APP_PATH" "$APP_STORE_MAX_SDK_VERSION"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip -qry "$IPA_PATH" Payload
          test -f "$IPA_PATH"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: YamabikoChat-unsigned-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/YamabikoChat-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Resolve Release Tag
        id: release_tag
        env:
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          TAG="$TAG_INPUT"
          TS_COMPACT="$(date -u +'%Y%m%d-%H%M%S')"
          TS_LABEL="$(date -u +'%Y-%m-%d %H:%M UTC')"
          if [ -z "$TAG" ]; then
            TAG="ios-ipa-latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=iOS IPA ${TS_LABEL}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "Unsigned IPA built from \`${GITHUB_REF_NAME}\`."
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`"
            echo "- Built at: ${TS_LABEL}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish IPA as Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          prerelease: true
          body: ${{ steps.release_tag.outputs.body }}
          overwrite_files: true
          files: ${{ runner.temp }}/YamabikoChat-unsigned.ipa
