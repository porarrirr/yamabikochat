name: One-time license cleanup

on:
  push:
    paths:
      - .github/workflows/license-cleanup-release-assets.yml

permissions:
  contents: write

jobs:
  delete-targeted-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-fix release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_ids=(412818434 412715158 412583887 367929397 368084482 365665251 364398523 364093078 512358784 353760128 353750952 353745547 353736796 353707586 356694726 356662178 356642836 355861909 355849274 354829966 354809461 354799922 354072101 354065999 379428525 367986659 367929156 367927362 365902046 365900534 365662407 365660904 364396738 364374599 364374019 364092626 364084256 364083649 362874712 362868504 362868382 362857547 362856364 357206861 357133928 356787498 354028601 353686740 353987224 353979244 353969571 353961182 353941568 353929215 353917792 353903927 353770230 353680783 353055966)
          for asset_id in "${asset_ids[@]}"; do
            echo "Deleting release asset ${asset_id}"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
