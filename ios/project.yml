name: YamabikoChat
author: porarri
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: 17.0
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.6.0
settings:
  SWIFT_VERSION: 5.10
  SWIFT_STRICT_CONCURRENCY: targeted
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 7
aggregateTargets:
  YamabikoBuildMetadata:
    buildScripts:
      - name: Prepare shared build versions
        script: scripts/prepare-build-info.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/prepare-build-info.sh
          - $(SRCROOT)/scripts/set-build-version.sh
          - $(SRCROOT)/YamabikoChat/App/Resources/Info.plist
          - $(SRCROOT)/YamabikoShareExtension/Info.plist
        outputFiles:
          - $(BUILD_DIR)/YamabikoBuildMetadata/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/App-Info.plist
          - $(BUILD_DIR)/YamabikoBuildMetadata/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/ShareExtension-Info.plist
targets:
  YamabikoChat:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoChat
        excludes:
          - Extensions
          - Python/Resources
          - App/Resources/Info.plist
      - path: PiRuntime/bundle/main.js
        buildPhase: resources
      - path: PiRuntime/bundle/PiAssets
        type: folder
        buildPhase: resources
      - path: YamabikoChat/Python/Resources/yamabiko_runtime.py
        buildPhase: resources
      - path: YamabikoChat/Python/Resources/python-sandbox.js
        buildPhase: resources
      - path: YamabikoChat/Python/Resources/python-worker.js
        buildPhase: resources
      - path: YamabikoChat/Python/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Vendor/Pyodide
        type: folder
        buildPhase: resources
        excludes:
          - distribution.tgz
    resources:
      - path: YamabikoChat/App/Resources
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios
      INFOPLIST_FILE: $(BUILD_DIR)/YamabikoBuildMetadata/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/App-Info.plist
      DEVELOPMENT_LANGUAGE: en
      CODE_SIGN_ENTITLEMENTS: YamabikoChat/App/Resources/YamabikoChat.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 77V64TWCFD
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: YamabikoChat/Pi/YamabikoChat-Bridging-Header.h
      ENABLE_BITCODE: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/YamabikoChat/Features/Tools/GenUI/NativeCEL/quickjs"
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - target: YamabikoBuildMetadata
      - package: GRDB
      - package: Yams
      - package: ZIPFoundation
      - package: Markdown
      - framework: Vendor/NodeMobile.xcframework
        embed: true
      - target: YamabikoShareExtension
        embed: true
    preBuildScripts:
      - name: Generate Markdown renderer fallback
        script: python3 scripts/generate-markdown-renderer.py
        inputFiles:
          - $(SRCROOT)/scripts/generate-markdown-renderer.py
          - $(SRCROOT)/YamabikoChat/App/Resources/mathjax/markdown-renderer.js
        outputFiles:
          - $(SRCROOT)/YamabikoChat/Features/Chat/MathMarkdownRendererSource.generated.swift
      - name: Copy legal notices
        script: scripts/copy-legal-notices.sh
        inputFiles:
          - $(SRCROOT)/scripts/copy-legal-notices.sh
          - $(SRCROOT)/../LICENSE
          - $(SRCROOT)/../THIRD_PARTY_NOTICES.md
          - $(SRCROOT)/../third_party/nodejs-mobile/LICENSE
          - $(SRCROOT)/../third_party/npm-licenses.md
          - $(SRCROOT)/../third_party/pi-subagents-LICENSE.txt
          - $(SRCROOT)/../third_party/pyodide-LICENSE.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notonastaliqurdu.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notosansarabic.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notosansbengali.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notosansdevanagari.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notosansjp.txt
          - $(SRCROOT)/YamabikoChat/Python/Resources/Fonts/licenses/OFL-notosanssc.txt
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/LICENSE.txt
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/THIRD_PARTY_NOTICES.md
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/NODEJS_LICENSE.txt
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/npm-licenses.md
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/PI_SUBAGENTS_LICENSE.txt
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/PYODIDE_LICENSE.txt
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/legal/NOTO_FONTS_LICENSES.txt
  YamabikoShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoShareExtension
        excludes:
          - Info.plist
      - path: YamabikoChat/Shared
        includes:
          - AppConstants.swift
          - AppGroupShareStorage.swift
          - SharePayload.swift
    resources:
      - path: YamabikoShareExtension/PrivacyInfo.xcprivacy
      - path: YamabikoShareExtension/en.lproj
      - path: YamabikoShareExtension/ja.lproj
      - path: YamabikoShareExtension/es.lproj
      - path: YamabikoShareExtension/fr.lproj
      - path: YamabikoShareExtension/zh-Hans.lproj
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.share
      INFOPLIST_FILE: $(BUILD_DIR)/YamabikoBuildMetadata/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/ShareExtension-Info.plist
      CODE_SIGN_ENTITLEMENTS: YamabikoShareExtension/YamabikoShareExtension.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 77V64TWCFD
      APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - target: YamabikoBuildMetadata
  YamabikoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoTests
      - path: PiRuntime/src/pcc-subagent-schema.json
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.tests
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 77V64TWCFD
    dependencies:
      - target: YamabikoChat
  YamabikoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YamabikoChat
schemes:
  YamabikoChat:
    build:
      targets:
        YamabikoChat: all
        YamabikoShareExtension: all
        YamabikoTests: [test]
        YamabikoUITests: [test]
    test:
      targets:
        - YamabikoTests
        - YamabikoUITests
