name: YamabikoChat
author: porarri
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: 17.0
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  SWIFT_VERSION: 5.10
  MARKETING_VERSION: 1.0.0
  CURRENT_PROJECT_VERSION: 7
targets:
  YamabikoChat:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoChat
        excludes:
          - Extensions
          - Python/Resources
      - path: PiRuntime/bundle/main.js
        buildPhase: resources
      - path: YamabikoChat/Python/Resources/yamabiko_runtime.py
        buildPhase: resources
    resources:
      - path: YamabikoChat/App/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios
      INFOPLIST_FILE: YamabikoChat/App/Resources/Info.plist
      DEVELOPMENT_LANGUAGE: en
      CODE_SIGN_ENTITLEMENTS: YamabikoChat/App/Resources/YamabikoChat.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 77V64TWCFD
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_OBJC_BRIDGING_HEADER: YamabikoChat/Pi/YamabikoChat-Bridging-Header.h
      ENABLE_BITCODE: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
      HEADER_SEARCH_PATHS:
        - "$(BUILT_PRODUCTS_DIR)/Python.framework/Headers"
      EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - package: GRDB
      - package: Yams
      - package: ZIPFoundation
      - framework: Vendor/NodeMobile.xcframework
        embed: true
      - framework: Vendor/Python.xcframework
        embed: true
      - target: YamabikoShareExtension
        embed: true
    preBuildScripts:
      - name: Copy legal notices
        script: scripts/copy-legal-notices.sh
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Process Python libraries
        script: scripts/process-python-libraries.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Set build-time version
        script: scripts/set-build-version.sh read
        basedOnDependencyAnalysis: false
  YamabikoShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoShareExtension
      - path: YamabikoChat/Shared
        includes:
          - AppConstants.swift
          - AppGroupShareStorage.swift
          - SharePayload.swift
    resources:
      - path: YamabikoShareExtension/PrivacyInfo.xcprivacy
      - path: YamabikoShareExtension/en.lproj
      - path: YamabikoShareExtension/ja.lproj
      - path: YamabikoShareExtension/es.lproj
      - path: YamabikoShareExtension/fr.lproj
      - path: YamabikoShareExtension/zh-Hans.lproj
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.share
      INFOPLIST_FILE: YamabikoShareExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: YamabikoShareExtension/YamabikoShareExtension.entitlements
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 77V64TWCFD
      APPLICATION_EXTENSION_API_ONLY: YES
    postBuildScripts:
      - name: Set build-time version
        script: scripts/set-build-version.sh write
        basedOnDependencyAnalysis: false
  YamabikoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoTests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.tests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YamabikoChat
  YamabikoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: YamabikoUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.porarri.yamabikochat.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YamabikoChat
schemes:
  YamabikoChat:
    build:
      targets:
        YamabikoChat: all
        YamabikoShareExtension: all
        YamabikoTests: [test]
        YamabikoUITests: [test]
    test:
      targets:
        - YamabikoTests
        - YamabikoUITests
