elect{border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:10px;min-width:0;width:100%}[aria-invalid=true]{border-color:#c94747!important}.genui-textarea{resize:vertical}.genui-slider{width:100%;accent-color:var(--accent)}.genui-checkbox{display:flex;align-items:center;gap:8px}.genui-checkbox input,input[type=radio]{accent-color:var(--accent);width:18px;height:18px}.genui-segmented-control{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px;flex-wrap:wrap}.genui-segmented-control label{display:flex;align-items:center;padding:7px 12px;border-radius:9px;gap:6px}.genui-segmented-control label:has(input:checked){background:var(--surface);box-shadow:0 1px 5px #0001}.genui-radio-group{display:flex;gap:12px;flex-wrap:wrap;border:0;padding:0;margin:0}.genui-radio-group label{display:flex;align-items:center;gap:6px}.genui-table{width:100%;border-collapse:collapse;font-size:13px;display:table}.genui-table td,.genui-table th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}.genui-table th,.header-row{font-weight:600;background:var(--soft)}.sticky-header th{position:sticky;top:0}.no-dividers td,.no-dividers th{border:0}.genui-list{padding-left:24px;margin:0;display:flex;flex-direction:column;gap:10px}.genui-list-item p{font-size:13px;color:var(--muted)}.connected-list li{border-left:2px solid var(--border);padding-left:12px}.genui-carousel{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:8px}.genui-carousel-item,.genui-carousel-media-item{flex:0 0 calc(100% / var(--visible-items,1) - 12px);scroll-snap-align:start;min-width:0;border-radius:12px;overflow:hidden}.genui-popover{position:relative}.genui-popover summary{cursor:pointer;list-style:none;color:var(--accent)}.genui-popover-content{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px;box-shadow:0 6px 20px #0002}.genui-AsyncImage{width:100%;height:auto;display:block;border-radius:10px}.genui-AsyncImageGroup{gap:10px}.genui-AsyncVideo{width:100%;border-radius:12px}.genui-Chart svg{width:100%;height:auto;overflow:visible}.genui-MapWidgetV2{background:var(--soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:12px}.genui-Link,.genui-Entity,.genui-Cite,.genui-FileCite,.genui-CodeCite,.genui-MemoryCite{background:transparent;border:0;color:var(--accent);text-align:left;padding:2px;text-decoration:underline;font-size:inherit}.genui-FileNavList{display:flex;flex-direction:column;gap:8px}.genui-CodeBlock,pre{background:var(--soft);border-radius:10px;padding:14px;font-family:ui-monospace,monospace;font-size:12px;overflow:auto;white-space:pre-wrap;margin:0}.genui-code{font-family:ui-monospace,monospace;background:var(--soft);padding:2px 5px;border-radius:4px}.genui-blockquote{border-left:3px solid var(--accent);padding:6px 14px;margin:0;color:var(--muted)}.genui-divider{border:0;border-top:1px solid var(--border);width:100%;margin:8px 0}.genui-unavailable{padding:12px;border:1px dashed var(--border);border-radius:9px;color:var(--muted);font-size:12px;white-space:pre-wrap}.math-block{display:block;padding:12px;white-space:pre-wrap}.math-inline{display:inline;font-family:serif}.genui-icon{display:inline-flex;justify-content:center;align-items:center;font-size:20px}@media(max-width:420px){body{padding:8px}.genui-card{padding:14px}.genui-row{flex-wrap:wrap}.genui-table{font-size:12px}.genui-table td,.genui-table th{padding:7px 5px}}

.genui-slider{min-height:44px}.genui-slider[data-slider-style=thin]::-webkit-slider-runnable-track{height:3px}.genui-slider[data-slider-style=thick]::-webkit-slider-runnable-track{height:8px}

/* Mobile defaults keep author-supplied sizes intact and retain touch targets. */
@media (max-width: 639px) {
  :root {font-size:14px;line-height:1.4}
  body {padding:10px}
  h2 {font-size:20px}
  .genui-box,.genui-col,.genui-card,.genui-form,.genui-WritingBlock {gap:8px}
  .genui-card,.genui-WritingBlock {padding:12px;border-radius:12px}
  .genui-grid,.genui-flow,.genui-row {gap:8px}
  .genui-document-subtitle {margin-bottom:10px}
  .genui-list {gap:6px}
  .genui-input,.genui-select,.genui-date-picker {min-height:44px;padding:8px}
  .genui-MapWidgetV2 {padding:12px;gap:8px}
}

    .catalog-intro { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .catalog-action { min-height: 0; margin: 0 12px 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--soft); color: var(--muted); font-size: 12px; }
    .genui-title { overflow-wrap: anywhere; }
    .genui-card { min-width: 0; }
    .genui-row { min-width: 0; }
    .genui-carousel-item { min-height: 84px; padding: 12px; border: 1px solid var(--border); background: var(--surface); }
    .genui-carousel-media-item { padding: 4px; border: 1px solid var(--border); background: var(--surface); }
    .genui-WritingBlock { min-width: 0; }
    .genui-AppBlock { padding: 10px; border: 1px dashed var(--border); border-radius: 10px; }
    .primitive-board { width: 100%; max-width: 560px; height: auto; }
    #root { max-width: 1050px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="catalog-action" class="catalog-action" aria-live="polite">ボタン、入力、カルーセルを操作できます。MapKit・iOSシート・アプリ遷移はこのブラウザでは起動しません。</div>
  <script>
    const h = (type, props, ...children) => ({type, props: props || {}, children: children.flat(Infinity)});
    const demo = (name, example, note) => h('card', {padding: 3, gap: 2},
      h('caption', {color: 'secondary', weight: 700}, name),
      example,
      note ? h('caption', {color: 'secondary'}, note) : null
    );
    const section = (title, description, examples) => h('col', {gap: 3},
      h('title', {size: 'lg'}, title),
      h('caption', {color: 'secondary'}, description),
      h('grid', {columns: 2, gap: 3}, ...examples)
    );
    const chartData = [
      {month: '1月', x: 1, amount: 24, target: 30, name: '基本', share: 45},
      {month: '2月', x: 2, amount: 42, target: 38, name: '追加', share: 30},
      {month: '3月', x: 3, amount: 33, target: 48, name: '継続', share: 25}
    ];
    const chart = (type) => h('Chart', {content: {
      chartType: type,
      data: chartData,
      xKey: type === 'scatter' ? 'x' : 'month',
      valueKey: 'amount',
      yAxisMin: 0,
      yAxisMax: 60,
      xAxisLabel: type === 'scatter' ? '操作回数' : '月',
      valueSuffix: ' pt',
      series: [{dataKey: 'amount', label: '利用量'}]
    }});
    const icon = (name) => h('icon', {name, size: 24});
    const svgBoard = h('svg', {width: '100%', height: 180, viewBox: '0 0 560 180'},
      h('defs', {},
        h('linearGradient', {id: 'sample-gradient', x1: '0', y1: '0', x2: '1', y2: '1'},
          h('stop', {offset: '0%', stopColor: '#47c7b6'}),
          h('stop', {offset: '100%', stopColor: '#426db7'})
        ),
        h('radialGradient', {id: 'sample-radial', cx: '50%', cy: '50%', r: '50%'},
          h('stop', {offset: '0%', stopColor: '#ffe37a'}),
          h('stop', {offset: '100%', stopColor: '#e78755'})
        ),
        h('clipPath', {id: 'sample-clip'}, h('circle', {cx: 480, cy: 65, r: 38}))
      ),
      h('rect', {x: 8, y: 12, width: 100, height: 62, rx: 12, fill: 'url(#sample-gradient)'}),
      h('text', {x: 12, y: 91, fill: 'var(--text)', fontSize: 11}, 'rect + linearGradient'),
      h('g', {transform: 'translate(125 5)'},
        h('path', {d: 'M10 65 C25 12 70 12 88 65', fill: 'none', stroke: '#148d83', strokeWidth: 5, strokeLinecap: 'round'}),
        h('line', {x1: 8, y1: 78, x2: 96, y2: 78, stroke: '#60736f', strokeWidth: 2}),
        h('text', {x: 2, y: 100, fill: 'var(--text)', fontSize: 11}, 'g + path + line')
      ),
      h('circle', {cx: 275, cy: 43, r: 27, fill: '#6ca9de'}),
      h('ellipse', {cx: 275, cy: 92, rx: 36, ry: 13, fill: '#a17bc6'}),
      h('text', {x: 242, y: 126, fill: 'var(--text)', fontSize: 11}, 'circle + ellipse'),
      h('polyline', {points: '340,95 360,55 380,76 400,34', fill: 'none', stroke: '#d07a56', strokeWidth: 4, strokeLinejoin: 'round'}),
      h('polygon', {points: '355,125 377,96 398,125', fill: '#dfc25d'}),
      h('text', {x: 340, y: 148, fill: 'var(--text)', fontSize: 11}, 'polyline + polygon'),
      h('rect', {x: 442, y: 27, width: 78, height: 78, fill: 'url(#sample-radial)', clipPath: 'url(#sample-clip)'}),
      h('text', {x: 442, y: 126, fill: 'var(--text)', fontSize: 11}, 'radialGradient + clipPath')
    );

    const resources = {
      mountain: {title: '山と湖', src: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=720&q=75', mime: 'image/jpeg'},
      coast: {title: '海岸', src: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=720&q=75', mime: 'image/jpeg'},
      flowerVideo: {title: 'Flower video', src: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4', mime: 'video/mp4'},
      'https://example.org': {title: 'Example favicon', src: 'https://www.apple.com/favicon.ico', mime: 'image/x-icon'},
      web: {title: 'サンプル記事', url: 'https://example.org/article', text: 'これは提供済みresourceのサンプル本文です。\n2行目: 引用表示に使われます。\n3行目: 詳細画面に渡されます。'},
      localFile: {title: '仕様メモ.txt', text: '1: 概要\n2: 入力と状態\n3: 表示部品\n4: 制約とフォールバック'},
      codeRef: {title: 'Sample.swift', text: 'struct Sample {\n    let value = 1\n}'},
    };

    window.__GENUI_THEME__ = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    window.__GENUI_SAVED_STATE__ = {};
    window.__GENUI_DOCUMENT__ = {
      title: 'リッチGenUI部品の実画面',
      subtitle: '以下はアプリ同梱のGenUI runtime.js / styles.cssで描画しています。入力やカルーセルは操作できます。',
      state: {name: 'Yamabiko', volume: 65, enabled: true, mode: 'light', choice: 'A', date: '2026-10-12', formStatus: '未送信', status: '操作するとここに状態を表示します。'},
      resources,
      ui: h('col', {gap: 6},
        section('文字・装飾', 'text, title, caption, label, badge, bold, italic, underline, strikethrough, code, math, blockquote',
          [
            demo('text', h('text', {}, '通常の本文テキスト。複数行は幅に合わせて折り返します。')),
            demo('title', h('title', {size: 'lg'}, '画面内の見出し')),
            demo('caption', h('caption', {color: 'secondary'}, '補助説明や注釈に使う小さな文字')),
            demo('label', h('label', {weight: 650}, '入力項目のラベル')),
            demo('badge', h('badge', {label: '完了', color: 'success', pill: true})),
            demo('bold / italic', h('text', {}, h('bold', {}, '太字'), ' ・ ', h('italic', {}, '斜体'))),
            demo('underline / strikethrough', h('text', {}, h('underline', {}, '下線'), ' ・ ', h('strikethrough', {}, '取り消し線'))),
            demo('code', h('text', {}, '設定値 ', h('code', {}, 'theme = "light"'))),
            demo('math', h('math', {value: 'a² + b² = c²', block: true}), '数式エンジンがない環境では式の文字列を表示'),
            demo('blockquote', h('blockquote', {}, '大事な前提や引用を、左罫線付きで表示します。'))
          ]),
        section('レイアウト', 'box, row, col, grid, grid-item, flow, flow-item, card, divider, spacer',
          [
            demo('box', h('box', {padding: 3, gap: 2, background: 'var(--soft)', border: '1px solid var(--border)', radius: 3}, h('text', {}, 'まとまりを囲う箱'), h('caption', {}, '余白・背景・境界線を指定'))),
            demo('row', h('row', {justify: 'between', align: 'center'}, h('badge', {label: '左'}), h('badge', {label: '右'}))),
            demo('col', h('col', {gap: 2}, h('text', {}, '上の行'), h('text', {}, '下の行'))),
            demo('grid + grid-item', h('grid', {columns: 2, gap: 2}, h('grid-item', {span: 1}, h('card', {padding: 2}, 'セル A')), h('grid-item', {span: 1}, h('card', {padding: 2}, 'セル B')))),
            demo('flow + flow-item', h('flow', {layout: 'row', gap: 2}, h('flow-item', {padding: 2, background: 'var(--soft)'}, 'flow A'), h('flow-item', {padding: 2, background: 'var(--soft)'}, 'flow B'), h('flow-item', {padding: 2, background: 'var(--soft)'}, 'flow C'))),
            demo('card', h('card', {padding: 3, shadow: true}, h('title', {size: 'md'}, '情報カード'), h('text', {}, '枠・背景・角丸で内容をひとまとまりにします。'))),
            demo('divider', h('col', {gap: 2}, h('text', {}, 'セクション A'), h('divider', {color: 'var(--accent)', size: 1}), h('text', {}, 'セクション B'))),
            demo('spacer', h('box', {height: 92, padding: 2, border: '1px solid var(--border)', radius: 2}, h('text', {}, '上'), h('spacer', {minSize: 'lg'}), h('text', {}, '下')))
          ]),
        section('入力・操作', 'button, pressable, input, textarea, slider, checkbox, select, segmented-control, radio-group, radio, date-picker, form',
          [
            demo('button', h('button', {label: '状態を更新', onClick: {type: 'setState', key: 'status', value: 'ボタンをタップしました'}})),
            demo('pressable', h('pressable', {padding: 3, border: '1px solid var(--border)', radius: 2, onClick: {type: 'setState', key: 'status', value: 'カードをタップしました'}}, h('bold', {}, 'タップ可能な領域'), h('caption', {}, '押すとアクションを実行'))),
            demo('input', h('input', {name: 'name', bind: 'name', placeholder: '文字を入力'})),
            demo('textarea', h('textarea', {name: 'note', bind: 'status', rows: 2, placeholder: '複数行入力'})),
            demo('slider', h('col', {}, h('text', {}, '値: {{volume}}'), h('slider', {name: 'volume', bind: 'volume', min: 0, max: 100, step: 1, marks: [0, 50, 100]}))),
            demo('checkbox', h('checkbox', {bind: 'enabled', checked: true, label: '有効にする'})),
            demo('select', h('select', {name: 'プラン', bind: 'mode', options: [{label: 'ライト', value: 'light'}, {label: 'ダーク', value: 'dark'}]})),
            demo('segmented-control', h('segmented-control', {label: '表示密度', bind: 'choice', options: [{label: '標準', value: 'A'}, {label: '広め', value: 'B'}]})),
            demo('radio-group', h('radio-group', {label: '配送方法', bind: 'choice'}), '現行validatorでは options が許可されないため、選択肢なしの枠として表示。個別radioは下の例。'),
            demo('radio', h('row', {align: 'center', gap: 2}, h('radio', {value: 'one'}), h('text', {}, '単独のラジオ項目'))),
            demo('date-picker', h('date-picker', {bind: 'date', placeholder: '日付を選択', clearable: true})),
            demo('form', h('form', {onSubmit: {type: 'setState', key: 'formStatus', value: '送信しました'}}, h('input', {name: 'email', inputType: 'email', placeholder: 'メールアドレス'}), h('button', {label: '送信', submit: true}))),
            demo('共有状態', h('col', {gap: 1}, h('text', {}, '名前: {{name}}'), h('text', {}, 'スライダー: {{volume}}'), h('text', {}, '状態: {{status}}'), h('text', {}, 'フォーム: {{formStatus}}')), '上の入力操作で同じstateが変わります。')
          ]),
        section('表・リスト', 'table, table-section, table-row, table-cell, list, list-item',
          [
            demo('table + section / row / cell', h('table', {stickyHeader: true}, h('table-section', {header: '今月の実績'}, h('table-row', {header: true}, h('table-cell', {header: true}, '月'), h('table-cell', {header: true}, '件数'), h('table-cell', {header: true}, '状態')), h('table-row', {}, h('table-cell', {}, '1月'), h('table-cell', {}, '24'), h('table-cell', {}, '完了')), h('table-row', {}, h('table-cell', {rowSpan: 1}, '2月'), h('table-cell', {colSpan: 2}, '準備中'))))),
            demo('list + list-item', h('list', {marker: 'number', start: 1, connector: true}, h('list-item', {label: '入力する', description: '条件をスライダーやフォームで指定'}), h('list-item', {label: '結果を見る', description: 'KPI・表・グラフを確認'})))
          ]),
        section('複合表示', 'carousel, carousel-item, carousel-media-item, popover, popover-trigger, popover-content',
          [
            demo('carousel + carousel-item', h('carousel', {showArrows: true, visibleItems: 1, snap: true}, h('carousel-item', {padding: 3, background: 'var(--soft)'}, h('title', {size: 'md'}, 'カード 1'), h('text', {}, '横へスワイプ')), h('carousel-item', {padding: 3, background: 'var(--soft)'}, h('title', {size: 'md'}, 'カード 2'), h('text', {}, '矢印でも移動')), h('carousel-item', {padding: 3, background: 'var(--soft)'}, h('title', {size: 'md'}, 'カード 3'), h('text', {}, 'スナップ位置で停止')))),
            demo('carousel-media-item', h('carousel', {visibleItems: 1}, h('carousel-media-item', {padding: 2, media: {type: 'AsyncImage', props: {ref: 'mountain', alt: '山と湖'}}}))),
            demo('popover family', h('popover', {open: false}, h('popover-trigger', {}, '補足を開く'), h('popover-content', {showCloseButton: true, side: 'bottom'}, h('text', {}, '文書の流れの中に展開される補足です。'))))
          ]),
        section('メディア・アイコン', 'AsyncImage, AsyncImageGroup, AsyncVideo, favicon, icon',
          [
            demo('AsyncImage', h('AsyncImage', {ref: 'mountain', alt: '山と湖の写真', height: 155, fit: 'cover', radius: 3}), 'HTTPS resourceから読み込み。通信不可ならfallbackを表示。'),
            demo('AsyncImageGroup', h('AsyncImageGroup', {refs: ['mountain', 'coast'], layout: 'row', size: 'sm', fallback: '画像を読み込めません'})),
            demo('AsyncVideo', h('AsyncVideo', {ref: 'flowerVideo'}), '動画の再生コントロール付き。サンプル動画の取得には通信が必要です。'),
            demo('favicon', h('favicon', {url: 'https://example.org', alt: 'Example favicon', size: 28}), 'resourcesのキーにURLを指定し、画像URLを対応付けた例。'),
            demo('icon', h('row', {gap: 3, align: 'center'}, icon('check'), icon('heart'), icon('map'), icon('unknown-name')), '既知glyphは記号、未知名は代替glyphで表示。')
          ]),
        section('グラフ', 'Chart: bar / line / scatter / pie', [
          demo('Chart · bar', chart('bar')),
